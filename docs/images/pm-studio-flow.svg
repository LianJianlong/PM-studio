<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc"><title id="title">PM studio: connected information and controlled changes</title><desc id="desc">Reusable templates feed customizable records, planning and reports. Permission-aware AI reads evidence and proposes changes for user confirmation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#438777"/></marker></defs><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#203e4b}.s{font-size:16px;fill:#607c87}.t{font-size:20px;font-weight:700}</style><rect width="1280" height="460" rx="20" fill="#f3f8f6"/><text x="40" y="52" font-size="26" font-weight="700">Connect the evidence. Keep people in control.</text><text x="40" y="83" class="s">信息相互关联，写入由用户确认</text><rect x="40" y="125" width="270" height="135" rx="12" fill="white" stroke="#bad9ce"/><text x="60" y="160" class="t">Templates</text><text x="60" y="191" class="s">通用模板</text><text x="60" y="233" class="s">Fields · Types · Rules</text><path d="M315 193H341" stroke="#438777" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="125" width="270" height="135" rx="12" fill="white" stroke="#bad9ce"/><text x="370" y="160" class="t">Records</text><text x="370" y="191" class="s">自定义数据表</text><text x="370" y="233" class="s">References · Status</text><path d="M625 193H651" stroke="#438777" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="125" width="270" height="135" rx="12" fill="white" stroke="#bad9ce"/><text x="680" y="160" class="t">Planning</text><text x="680" y="191" class="s">计划与资源</text><text x="680" y="233" class="s">WBS · Activities · Cost</text><path d="M935 193H961" stroke="#438777" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="125" width="270" height="135" rx="12" fill="white" stroke="#bad9ce"/><text x="990" y="160" class="t">Reports &amp; AI</text><text x="990" y="191" class="s">报表与AI分析</text><text x="990" y="233" class="s">Evidence · Missing facts</text><rect x="40" y="291" width="1200" height="118" rx="12" fill="#e2f0e9"/><text x="65" y="328" class="t">Authorized read → Proposed change → Preview → User confirmation → Audited write</text><text x="65" y="362" class="s">权限内查询 → 提出修改 → 结果预览 → 用户确认 → 写入并审计</text><text x="65" y="391" font-size="14" fill="#607c87">AI writing edits documents only. / AI写作只修改文档。</text></svg>