<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc"><title id="title">PM studio — a connected project workspace</title><desc id="desc">Concept illustration with fictional data: customizable tables, project planning, reports and permission-aware AI.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf7f3"/><stop offset="1" stop-color="#f6f8fb"/></linearGradient></defs><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#203e4b}.small{font-size:15px;fill:#657e89}.label{font-size:17px}.strong{font-weight:700}.muted{fill:#657e89}</style><rect width="1280" height="760" rx="24" fill="url(#bg)"/><rect x="48" y="40" width="52" height="52" rx="12" fill="#00856d"/><text x="74" y="74" text-anchor="middle" font-size="24" fill="white" style="fill:white">PM</text><text x="116" y="64" font-size="26" class="strong">PM studio</text><text x="116" y="88" class="small">Built from real project needs · 为实际项目管理而生</text><text x="48" y="145" font-size="32" class="strong">Your tables. Your plan. Your team.</text><text x="48" y="177" font-size="19" class="muted">高度自定义表格 · 关联计划 · 团队协作</text><rect x="48" y="210" width="1184" height="440" rx="14" fill="white" stroke="#c8ddd8"/><rect x="49" y="211" width="174" height="438" rx="14" fill="#f4f8f7"/><text x="78" y="257" class="label strong">Overview</text><text x="78" y="278" class="small">项目总览</text><rect x="61" y="307" width="149" height="52" rx="8" fill="#d9eee6"/><text x="78" y="325" class="label strong">Data entry</text><text x="78" y="346" class="small">数据录入</text><text x="78" y="393" class="label strong">Planning</text><text x="78" y="414" class="small">计划管理</text><text x="78" y="461" class="label strong">Reports</text><text x="78" y="482" class="small">报表中心</text><text x="78" y="529" class="label strong">AI assistant</text><text x="78" y="550" class="small">AI助手</text><text x="248" y="246" font-size="20" class="strong">Procurement register / 采购台账</text><text x="248" y="273" class="small">Custom fields · Linked activities · Filters · Printable forms</text><rect x="248" y="293" width="958" height="40" fill="#edf3f4"/><text x="260" y="318" font-size="14" class="strong">Code / 编码</text><text x="377" y="318" font-size="14" class="strong">Item / 名称</text><text x="612" y="318" font-size="14" class="strong">Activity / 关联作业</text><text x="802" y="318" font-size="14" class="strong">Status / 状态</text><text x="1007" y="318" font-size="14" class="strong">Owner / 责任人</text><rect x="248" y="333" width="958" height="47" fill="#fbfdfc" stroke="#e0e8e9"/><text x="260" y="362" font-size="15">PO-001</text><text x="377" y="362" font-size="15">Cooling equipment</text><text x="612" y="362" font-size="15">ACT-010</text><text x="802" y="362" font-size="15">Confirmed</text><text x="1007" y="362" font-size="15">Team A</text><rect x="248" y="380" width="958" height="47" fill="white" stroke="#e0e8e9"/><text x="260" y="409" font-size="15">PO-002</text><text x="377" y="409" font-size="15">Power distribution</text><text x="612" y="409" font-size="15">ACT-020</text><text x="802" y="409" font-size="15">Draft</text><text x="1007" y="409" font-size="15">Team B</text><rect x="248" y="427" width="958" height="47" fill="#fbfdfc" stroke="#e0e8e9"/><text x="260" y="456" font-size="15">PO-003</text><text x="377" y="456" font-size="15">Control system</text><text x="612" y="456" font-size="15">ACT-030</text><text x="802" y="456" font-size="15">Confirmed</text><text x="1007" y="456" font-size="15">Team A</text><text x="248" y="516" font-size="17" class="strong">Connected schedule / 关联进度计划</text><text x="250" y="550" class="small">Prepare</text><rect x="460" y="533" width="160" height="21" rx="4" fill="#76baaa"/><text x="250" y="582" class="small">Install</text><rect x="620" y="565" width="265" height="21" rx="4" fill="#00856d"/><text x="250" y="614" class="small">Deliver</text><rect x="885" y="597" width="200" height="21" rx="4" fill="#e3a94b"/><text x="48" y="695" class="small">Small teams · Flexible workflows · Chinese &amp; English · Self-hosted</text><text x="48" y="724" font-size="13" class="muted">Concept illustration / 功能示意图 — fictional content, not a live project screenshot.</text></svg>